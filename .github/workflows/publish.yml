name: Publish Package

on:
  release:
    types: [published]
  workflow_dispatch:

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout release tag
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.release.tag_name || github.ref }}

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
          server-id: github
          server-username: GITHUB_ACTOR
          server-password: GITHUB_TOKEN

      - name: Require a release tag matching the POM
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name || github.ref_name }}
          EVENT_NAME: ${{ github.event_name }}
          REF_TYPE: ${{ github.ref_type }}
        run: |
          if [ "$EVENT_NAME" = workflow_dispatch ] && [ "$REF_TYPE" != tag ]; then
            echo "Manual publication requires selecting a release tag."
            exit 1
          fi
          version=$(mvn -B -q -DforceStdout help:evaluate -Dexpression=project.version)
          case "$version" in
            *-SNAPSHOT) echo "Snapshot publication is disabled in this workflow."; exit 1 ;;
          esac
          test "$RELEASE_TAG" = "v$version"

      - name: Verify release artifacts
        run: mvn -B -ntp clean verify --file pom.xml

      - name: Publish to GitHub Packages
        run: mvn -B -ntp deploy --file pom.xml
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
