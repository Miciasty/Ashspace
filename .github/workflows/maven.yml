name: Java CI with Maven

on:
  push:
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven

      - name: Verify tests, packaged artifacts and README example
        run: mvn -B -ntp clean verify --file pom.xml

      - name: Identify verified artifacts
        id: artifact
        run: |
          version=$(mvn -B -q -DforceStdout help:evaluate -Dexpression=project.version)
          name="ashspace-$version"
          test -f "target/$name.jar"
          test -f "target/$name-sources.jar"
          test -f "target/$name-javadoc.jar"
          echo "name=$name" >> "$GITHUB_OUTPUT"

      - name: Upload verified artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ashspace-${{ github.sha }}
          if-no-files-found: error
          path: |
            target/${{ steps.artifact.outputs.name }}.jar
            target/${{ steps.artifact.outputs.name }}-sources.jar
            target/${{ steps.artifact.outputs.name }}-javadoc.jar
