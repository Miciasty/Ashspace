name: Ashspace WIKI

on:
  push:
    branches: [master]
    paths: ['wiki/**', 'src/main/java/**', 'pom.xml', 'LICENSE', 'NOTICE', '.github/workflows/pages.yml']
  pull_request:
    paths: ['wiki/**', 'src/main/java/**', 'pom.xml', 'LICENSE', 'NOTICE', '.github/workflows/pages.yml']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: wiki-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: wiki/package-lock.json
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Install documentation tools
        run: npm ci
        working-directory: wiki
      - name: Resolve example dependencies
        run: mvn -B -ntp dependency:build-classpath -DincludeScope=compile -Dmdep.outputFile=target/wiki-classpath.txt
      - name: Build and validate WIKI
        run: npm run build
        working-directory: wiki
      - name: Compile and run Java examples
        run: npm run check:examples
        working-directory: wiki
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: wiki/_site

  deploy:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/master'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/configure-pages@v5
      - name: Deploy WIKI
        id: deployment
        uses: actions/deploy-pages@v4
